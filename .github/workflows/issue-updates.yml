name: Issue updates

on:
  push:
    branches: ["**"]

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
      - uses: actions/github-script@v8
        with:
          script: |
            const run = require('./.github/scripts/issue-status.js');
            await run({ github, context, core }, 'push');
